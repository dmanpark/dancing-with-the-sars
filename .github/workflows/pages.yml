# Pre-event placeholder deploy (prompts/build.md Phase 0 step 6).
# Phase 3 replaces this with the version that also copies the tiles branch.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Add .nojekyll
        run: touch app/.nojekyll
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
